name: "Weekly Link Check"
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d _site
        env:
          JEKYLL_ENV: "production"

      # Checks external links too (GitHub PDFs in UoEO_MSc_EIM and MScProject).
      # Ignored: LinkedIn (blocks bots with status 999); the theme's bare Google Fonts
      # preconnect origins (not pages, so they return 404); doi.org links, which resolve to
      # publishers such as SAGE that answer bots with 403.
      - name: Check all links
        run: |
          bundle exec htmlproofer _site \
            --ignore-status-codes "0,429,999" \
            --ignore-urls "/linkedin\.com/,/^https:\/\/fonts\.(googleapis|gstatic)\.com\/?$/,/doi\.org\//,/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"
